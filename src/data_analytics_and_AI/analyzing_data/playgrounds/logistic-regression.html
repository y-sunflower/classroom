<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logistic regression playground</title>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body data-model="logistic" data-sample-count="360">
    <main class="playground">
      <section class="controls" aria-label="Model controls">
        <label class="control" for="threshold">
          <span class="control-label"
            >Positive threshold <output id="threshold-value">50%</output></span
          >
          <input
            id="threshold"
            type="range"
            min="20"
            max="80"
            step="5"
            value="50"
            data-suffix="%"
          />
        </label>
        <button class="fit-button" id="fit-button" type="button">
          Fit model <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </section>
      <div class="chart-heading">
        <div class="legend" aria-label="Chart legend">
          <span class="legend-item"><span class="swatch"></span>class 1</span>
          <span class="legend-item"
            ><span class="swatch warm"></span>class 2</span
          >
        </div>
      </div>
      <div class="plot-wrap">
        <canvas
          id="chart"
          role="img"
          aria-label="Classification examples and logistic regression decision regions; hover a square for class probabilities"
          aria-describedby="hint"
        ></canvas>
      </div>
      <div class="stats">
        <span class="stat" id="score-stat" hidden
          >Training match <output id="score-output">—</output></span
        >
      </div>
    </main>
    <script src="./playground.js"></script>
  </body>
</html>
