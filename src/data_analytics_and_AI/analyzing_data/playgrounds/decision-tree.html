<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision tree playground</title>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body data-model="tree">
    <main class="playground">
      <section class="controls" aria-label="Model controls">
        <label class="control" for="sample-count">
          <span class="control-label"
            >Sample size <output id="sample-output">180</output></span
          >
          <input
            id="sample-count"
            type="range"
            min="60"
            max="360"
            step="30"
            value="180"
          />
        </label>
        <label class="control" for="depth">
          <span class="control-label"
            >Maximum depth <output id="depth-value">4</output></span
          >
          <input id="depth" type="range" min="1" max="8" step="1" value="4" />
        </label>
        <label class="control" for="leaf">
          <span class="control-label"
            >Minimum examples per group <output id="leaf-value">6</output></span
          >
          <input id="leaf" type="range" min="2" max="18" step="2" value="6" />
        </label>
        <button class="fit-button" id="fit-button" type="button">
          Fit model <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </section>
      <div class="chart-heading">
        <div class="legend" aria-label="Chart legend">
          <span class="legend-item"><span class="swatch"></span>class 1</span>
          <span class="legend-item"
            ><span class="swatch warm"></span>class 2</span
          >
        </div>
      </div>
      <div class="plot-wrap">
        <canvas
          id="chart"
          role="img"
          aria-label="Classification examples and decision tree regions; hover a square for class probabilities"
          aria-describedby="hint"
        ></canvas>
      </div>
      <div class="stats">
        <span class="stat" id="score-stat" hidden
          >Training match <output id="score-output">—</output></span
        >
      </div>
    </main>
    <script src="./playground.js"></script>
  </body>
</html>
