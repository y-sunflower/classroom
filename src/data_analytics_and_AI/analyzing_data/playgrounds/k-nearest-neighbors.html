<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K-nearest neighbors playground</title>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body data-model="knn">
    <main class="playground">
      <section class="controls" aria-label="Model controls">
        <label class="control" for="sample-count">
          <span class="control-label"
            >Sample size <output id="sample-output">180</output></span
          >
          <input
            id="sample-count"
            type="range"
            min="60"
            max="360"
            step="30"
            value="180"
          />
        </label>
        <label class="control" for="neighbors">
          <span class="control-label"
            >Number of neighbors <output id="neighbors-value">7</output></span
          >
          <input
            id="neighbors"
            type="range"
            min="1"
            max="31"
            step="2"
            value="7"
          />
        </label>
        <button class="fit-button" id="fit-button" type="button">
          Fit model <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </section>
      <div class="chart-heading">
        <div class="legend" aria-label="Chart legend">
          <span class="legend-item"><span class="swatch"></span>class 1</span>
          <span class="legend-item"
            ><span class="swatch warm"></span>class 2</span
          >
        </div>
      </div>
      <div class="plot-wrap">
        <canvas
          id="chart"
          role="img"
          aria-label="Classification examples and nearest neighbor decision regions; hover a square for class probabilities and click to test a point"
          aria-describedby="hint"
        ></canvas>
      </div>
      <div class="stats">
        <span class="stat" id="score-stat" hidden
          >Training match <output id="score-output">—</output></span
        >
      </div>
    </main>
    <script src="./playground.js"></script>
  </body>
</html>
