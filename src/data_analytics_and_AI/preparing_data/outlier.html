<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graduate income distribution</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: transparent;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        margin: 0;
        background: transparent;
      }

      .visualization {
        width: min(100%, 940px);
        margin: 0 auto;
      }

      .controls {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 4px 12px;
      }

      .control {
        display: grid;
        gap: 4px;
        color: #64748b;
        font-size: 12px;
        line-height: 16px;
      }

      input,
      button {
        height: 40px;
        font: inherit;
      }

      input {
        width: 92px;
        padding: 0 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        color: #172033;
        background: #fff;
        text-align: center;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }

      button {
        padding: 0 16px;
        border: 1px solid #2563eb;
        border-radius: 6px;
        color: #fff;
        background: #2563eb;
        font-weight: 650;
        cursor: pointer;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .outlier-toggle {
        display: flex;
        min-height: 40px;
        align-items: center;
        gap: 7px;
        color: #334155;
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .outlier-toggle input {
        width: 14px;
        height: 14px;
        margin: 0;
        padding: 0;
        accent-color: #2563eb;
      }

      .chart-wrap {
        position: relative;
      }

      .chart {
        display: block;
        width: 100%;
        overflow: visible;
        background: #fff;
      }

      .baseline {
        stroke: #cbd5e1;
        stroke-width: 1.25;
      }

      .tick-mark {
        stroke: #94a3b8;
        stroke-width: 1.25;
      }

      .tick-label,
      .axis-label {
        fill: #64748b;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-anchor: middle;
      }

      .smooth-line {
        fill: none;
        stroke: #1d4ed8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3;
        opacity: 0;
        visibility: hidden;
        transition: opacity 300ms ease;
      }

      .smooth-line.visible {
        opacity: 0.9;
        visibility: visible;
      }

      .point {
        fill: #f97316;
        stroke: #fff;
        stroke-width: 1.25;
        cursor: crosshair;
        transition:
          r 120ms ease,
          opacity 160ms ease,
          filter 120ms ease;
      }

      .point.high-tail {
        fill: #dc2626;
      }

      .point.excluded {
        opacity: 0.16;
      }

      .point:hover,
      .point:focus-visible {
        r: 13.8px;
        stroke: #172033;
        stroke-width: 2;
        filter: drop-shadow(0 1px 4px #0f172a55);
        outline: none;
        opacity: 1;
      }

      .statistics {
        position: absolute;
        z-index: 2;
        top: 12px;
        right: 12px;
        display: grid;
        gap: 7px;
        min-width: 180px;
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        color: #334155;
        background: #ffffffed;
        box-shadow: 0 3px 12px #0f172a14;
        font-size: 12px;
      }

      .statistics[hidden] {
        display: none;
      }

      .statistic {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }

      .statistic output {
        color: #0f172a;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        white-space: nowrap;
      }

      .statistics .outlier-toggle {
        min-height: 0;
        margin-top: 2px;
      }

      .tooltip {
        position: absolute;
        z-index: 3;
        padding: 5px 8px;
        border: 1px solid #dbe3ee;
        border-radius: 7px;
        color: #172033;
        background: #fff;
        box-shadow: 0 3px 12px #0f172a1c;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 9px));
        transition: opacity 100ms ease;
        visibility: hidden;
      }

      .tooltip.visible {
        opacity: 1;
        visibility: visible;
      }

      @media (max-width: 480px) {
        body {
          padding: 8px 4px;
        }

        .controls .control input {
          width: 72px;
          padding: 0 6px;
        }

        .controls button {
          padding: 0 12px;
        }

        .statistics {
          top: 8px;
          right: 8px;
          min-width: 172px;
          padding: 8px 9px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="visualization">
      <div class="controls">
        <button id="generate" type="button">Generate</button>
      </div>

      <div class="chart-wrap">
        <svg
          class="chart"
          viewBox="0 0 900 430"
          role="group"
          aria-label="Interactive right-skewed distribution of annual income ten years after graduation"
        >
          <line class="baseline" x1="48" y1="354" x2="852" y2="354" />
          <g id="axis-ticks" aria-hidden="true"></g>
          <path id="smooth-line" class="smooth-line" />
          <g id="points"></g>
          <text class="axis-label" x="450" y="414">Annual income</text>
        </svg>
        <output id="tooltip" class="tooltip" aria-hidden="true"></output>
        <aside id="statistics" class="statistics" aria-live="polite" hidden>
          <div class="statistic">
            <span>Mean</span><output id="mean">—</output>
          </div>
          <div class="statistic">
            <span>Median</span><output id="median">—</output>
          </div>
          <label class="outlier-toggle">
            <input id="include-high" type="checkbox" checked />
            Include $500k outlier
          </label>
        </aside>
      </div>
    </main>

    <script>
      const svgNamespace = "http://www.w3.org/2000/svg";
      const pointsLayer = document.getElementById("points");
      const smoothLine = document.getElementById("smooth-line");
      const chartWrap = document.querySelector(".chart-wrap");
      const tooltip = document.getElementById("tooltip");
      const statistics = document.getElementById("statistics");
      const meanOutput = document.getElementById("mean");
      const medianOutput = document.getElementById("median");
      const includeHigh = document.getElementById("include-high");
      const xMin = 48;
      const xMax = 852;
      const baseline = 354;
      const minimumIncome = 30000;
      const maximumIncome = 550000;
      const meanIncome = 65000;
      const logIncomeSpread = 0.6;
      const maximumTypicalIncome = 250000;
      // Edit this list to add or remove fixed high-income outcomes.
      const fixedHighIncomes = [500000];
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      const binCount = 40;
      let pointPitch = 22;
      let animationFrame = 0;
      let generationComplete = false;
      let currentSamples = [];
      let currentPoints = [];

      function incomeX(income) {
        return (
          xMin +
          ((income - minimumIncome) / (maximumIncome - minimumIncome)) *
            (xMax - xMin)
        );
      }

      function incomeBin(income) {
        return Math.max(
          0,
          Math.min(
            binCount - 1,
            Math.floor(((incomeX(income) - xMin) / (xMax - xMin)) * binCount),
          ),
        );
      }

      const salaryFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0,
      });

      function drawAxisTicks() {
        const ticks = document.getElementById("axis-ticks");
        const values = [
          30000, 50000, 100000, 150000, 200000, 250000, 300000, 350000, 400000,
          450000, 500000,
        ];

        for (const income of values) {
          const x = incomeX(income);
          const mark = document.createElementNS(svgNamespace, "line");
          mark.setAttribute("class", "tick-mark");
          mark.setAttribute("x1", x.toFixed(2));
          mark.setAttribute("x2", x.toFixed(2));
          mark.setAttribute("y1", String(baseline));
          mark.setAttribute("y2", String(baseline + 7));
          ticks.append(mark);

          const label = document.createElementNS(svgNamespace, "text");
          label.setAttribute("class", "tick-label");
          label.setAttribute("x", x.toFixed(2));
          label.setAttribute("y", String(baseline + 29));
          label.textContent = "$" + income / 1000 + "k";
          ticks.append(label);
        }
      }

      function incomeSample() {
        let u = 0;
        let v = 0;

        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();

        const standardNormal =
          Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        return Math.min(
          maximumTypicalIncome,
          minimumIncome +
            (meanIncome - minimumIncome) *
              Math.exp(
                logIncomeSpread * standardNormal -
                  (logIncomeSpread * logIncomeSpread) / 2,
              ),
        );
      }

      function easeOutCubic(progress) {
        return 1 - Math.pow(1 - progress, 3);
      }

      function showValue(circle, sample) {
        const circleRect = circle.getBoundingClientRect();
        const wrapRect = chartWrap.getBoundingClientRect();
        const description = sample.type === "outlier" ? " · outlier" : "";
        tooltip.textContent =
          salaryFormatter.format(sample.income) + description;
        tooltip.style.left =
          circleRect.left + circleRect.width / 2 - wrapRect.left + "px";
        tooltip.style.top = circleRect.top - wrapRect.top + "px";
        tooltip.classList.add("visible");
      }

      function includedSamples() {
        return currentSamples.filter(
          ({ type }) => type !== "outlier" || includeHigh.checked,
        );
      }

      function updateStatistics() {
        const incomes = includedSamples()
          .map(({ income }) => income)
          .sort((first, second) => first - second);
        const middle = Math.floor(incomes.length / 2);
        const median =
          incomes.length % 2 === 0
            ? (incomes[middle - 1] + incomes[middle]) / 2
            : incomes[middle];
        const mean =
          incomes.reduce((total, income) => total + income, 0) / incomes.length;

        meanOutput.textContent = salaryFormatter.format(mean);
        medianOutput.textContent = salaryFormatter.format(median);
      }

      function drawSmoothedLine(samples) {
        const counts = Array(binCount).fill(0);
        for (const { income } of samples) counts[incomeBin(income)]++;

        const tallestStack = Math.max(...counts);
        if (tallestStack === 0) {
          smoothLine.setAttribute("d", "");
          smoothLine.classList.remove("visible");
          return;
        }

        const sigma = 2.5;
        const smoothed = counts.map((_, index) => {
          let weightedCount = 0;
          let totalWeight = 0;

          for (
            let offset = -Math.ceil(sigma * 3);
            offset <= Math.ceil(sigma * 3);
            offset++
          ) {
            const sourceIndex = index + offset;
            if (sourceIndex < 0 || sourceIndex >= counts.length) continue;
            const weight = Math.exp(-0.5 * (offset / sigma) ** 2);
            weightedCount += counts[sourceIndex] * weight;
            totalWeight += weight;
          }

          return weightedCount / totalWeight;
        });
        const peak = Math.max(...smoothed);
        const points = smoothed
          .map((height, index) => ({
            x: xMin + ((index + 0.5) / binCount) * (xMax - xMin),
            y:
              baseline -
              (height / peak) * tallestStack * pointPitch +
              pointPitch / 2,
          }))
          .filter((point, index) => smoothed[index] >= peak * 0.015);

        let path = "M " + points[0].x.toFixed(2) + " " + points[0].y.toFixed(2);
        for (let index = 0; index < points.length - 1; index++) {
          const previous = points[Math.max(0, index - 1)];
          const current = points[index];
          const next = points[index + 1];
          const afterNext = points[Math.min(points.length - 1, index + 2)];
          const control1X = current.x + (next.x - previous.x) / 6;
          const control1Y = current.y + (next.y - previous.y) / 6;
          const control2X = next.x - (afterNext.x - current.x) / 6;
          const control2Y = next.y - (afterNext.y - current.y) / 6;
          path +=
            " C " +
            control1X.toFixed(2) +
            " " +
            control1Y.toFixed(2) +
            ", " +
            control2X.toFixed(2) +
            " " +
            control2Y.toFixed(2) +
            ", " +
            next.x.toFixed(2) +
            " " +
            next.y.toFixed(2);
        }

        smoothLine.setAttribute("d", path);
        smoothLine.classList.add("visible");
      }

      function updateSelection() {
        for (const point of currentPoints) {
          point.circle.classList.toggle(
            "excluded",
            point.type === "outlier" && !includeHigh.checked,
          );
        }

        updateStatistics();
        if (generationComplete) drawSmoothedLine(includedSamples());
      }

      function showStatistics() {
        updateSelection();
        statistics.hidden = false;
      }

      function generate() {
        cancelAnimationFrame(animationFrame);
        pointsLayer.replaceChildren();
        smoothLine.setAttribute("d", "");
        smoothLine.classList.remove("visible");
        statistics.hidden = true;
        generationComplete = false;
        tooltip.classList.remove("visible");

        const count = 5000;

        const samples = Array.from({ length: count - fixedCount }, () => ({
          income: incomeSample(),
          type: "typical",
        }));
        samples.push(
          ...fixedHighIncomes.map((income) => ({ income, type: "outlier" })),
        );
        currentSamples = samples;

        const counts = Array(binCount).fill(0);
        const assignments = samples.map((sample) => {
          const index = incomeBin(sample.income);
          const stack = counts[index]++;
          return { ...sample, index, stack };
        });
        const tallestStack = Math.max(...counts);
        pointPitch = Math.min(22, (baseline - 40) / tallestStack);
        const topRoom = Math.max(16, baseline - tallestStack * pointPitch - 24);
        const duration = prefersReducedMotion.matches ? 0 : 760;
        const start = performance.now();

        currentPoints = assignments.map((sample) => {
          const circle = document.createElementNS(svgNamespace, "circle");
          circle.setAttribute(
            "class",
            "point " + (sample.type === "typical" ? "typical" : "high-tail"),
          );
          circle.setAttribute("r", Math.min(9.2, pointPitch * 0.45).toFixed(1));
          circle.setAttribute(
            "cx",
            (xMin + ((sample.index + 0.5) / binCount) * (xMax - xMin)).toFixed(
              2,
            ),
          );
          circle.setAttribute("cy", topRoom.toFixed(2));
          circle.setAttribute("tabindex", "0");
          circle.setAttribute(
            "aria-label",
            (sample.type === "typical"
              ? "Graduate income "
              : "High-income graduate ") +
              salaryFormatter.format(sample.income),
          );
          pointsLayer.append(circle);
          circle.addEventListener("pointerenter", () =>
            showValue(circle, sample),
          );
          circle.addEventListener("pointerleave", () =>
            tooltip.classList.remove("visible"),
          );
          circle.addEventListener("focus", () => showValue(circle, sample));
          circle.addEventListener("blur", () =>
            tooltip.classList.remove("visible"),
          );

          return {
            circle,
            type: sample.type,
            targetY: baseline - (sample.stack + 0.5) * pointPitch,
            delay: prefersReducedMotion.matches
              ? 0
              : sample.stack * 65 + Math.random() * 35,
          };
        });

        function animate(now) {
          let complete = true;

          for (const point of currentPoints) {
            const progress = Math.max(
              0,
              Math.min(1, (now - start - point.delay) / duration),
            );
            if (progress < 1) complete = false;
            const eased = easeOutCubic(progress);
            const y = topRoom + (point.targetY - topRoom) * eased;
            point.circle.setAttribute("cy", y.toFixed(2));
          }

          if (complete) {
            generationComplete = true;
            showStatistics();
          } else {
            animationFrame = requestAnimationFrame(animate);
          }
        }

        if (prefersReducedMotion.matches) {
          for (const point of currentPoints)
            point.circle.setAttribute("cy", point.targetY.toFixed(2));
          generationComplete = true;
          showStatistics();
        } else {
          animationFrame = requestAnimationFrame(animate);
        }
      }

      drawAxisTicks();
      document.getElementById("generate").addEventListener("click", generate);
      includeHigh.addEventListener("change", updateSelection);
      generate();
    </script>
  </body>
</html>
