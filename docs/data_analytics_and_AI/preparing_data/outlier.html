<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary distribution</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: transparent;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        margin: 0;
        background: transparent;
      }

      .visualization {
        width: min(100%, 940px);
        margin: 0 auto;
      }

      .controls {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 4px 12px;
      }

      input,
      button {
        height: 40px;
        font: inherit;
      }

      input {
        width: 92px;
        padding: 0 12px;
        color: #172033;
        background: #fff;
        text-align: center;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }

      button {
        padding: 0 16px;
        border-color: #2563eb;
        color: #fff;
        background: #2563eb;
        font-weight: 650;
        cursor: pointer;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .chart {
        display: block;
        width: 100%;
        overflow: visible;
        background: #fff;
      }

      .baseline {
        stroke: #cbd5e1;
        stroke-width: 1.25;
      }

      .tick-mark {
        stroke: #94a3b8;
        stroke-width: 1.25;
      }

      .tick-label {
        fill: #64748b;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        text-anchor: middle;
      }

      .smooth-line {
        fill: none;
        stroke: #2563eb;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3;
        opacity: 0;
        visibility: hidden;
        transition: opacity 500ms ease;
      }

      .smooth-line.visible {
        opacity: 0.9;
        visibility: visible;
      }

      .point {
        fill: #f97316;
        stroke: #fff;
        stroke-width: 1.25;
        cursor: crosshair;
        transition:
          r 120ms ease,
          filter 120ms ease;
      }

      .point:hover,
      .point:focus-visible {
        r: 5.5px;
        stroke: #9a3412;
        stroke-width: 2;
        filter: drop-shadow(0 1px 4px #f9731688);
        outline: none;
      }

      .chart-wrap {
        position: relative;
      }

      .tooltip {
        position: absolute;
        z-index: 1;
        padding: 5px 8px;
        border: 1px solid #dbe3ee;
        border-radius: 7px;
        color: #172033;
        background: #fff;
        box-shadow: 0 3px 12px #0f172a1c;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 9px));
        transition: opacity 100ms ease;
        visibility: hidden;
      }

      .tooltip.visible {
        opacity: 1;
        visibility: visible;
      }

      @media (max-width: 480px) {
        body {
          padding: 8px 4px;
        }

        .controls input {
          width: 72px;
          padding: 0 6px;
        }

        .controls button {
          padding: 0 12px;
        }

        .chart {
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="visualization">
      <div class="controls">
        <input
          id="count"
          type="number"
          min="1"
          max="5000"
          step="1"
          value="1000"
          aria-label="Number of data points"
        />
        <input
          id="seed"
          type="number"
          min="0"
          max="2147483647"
          step="1"
          value="1"
          aria-label="Random seed"
        />
        <button id="generate" type="button">Generate</button>
      </div>

      <div class="chart-wrap">
        <svg
          class="chart"
          viewBox="0 0 900 430"
          role="group"
          aria-label="Salary distribution with a mean of 45,000 dollars, standard deviation of 5,000 dollars, and minimum of 25,000 dollars"
        >
          <line class="baseline" x1="48" y1="354" x2="852" y2="354" />
          <g id="axis-ticks" aria-hidden="true"></g>
          <path id="smooth-line" class="smooth-line" />
          <g id="points"></g>
        </svg>
        <output id="tooltip" class="tooltip" aria-hidden="true"></output>
      </div>
    </main>

    <script>
      const svgNamespace = "http://www.w3.org/2000/svg";
      const countInput = document.getElementById("count");
      const seedInput = document.getElementById("seed");
      const pointsLayer = document.getElementById("points");
      const smoothLine = document.getElementById("smooth-line");
      const chartWrap = document.querySelector(".chart-wrap");
      const tooltip = document.getElementById("tooltip");
      const xMin = 48;
      const xMax = 852;
      const baseline = 354;
      const domain = 4;
      const meanSalary = 45000;
      const standardDeviation = 7000;
      const minimumSalary = 25000;
      const maximumSalary = meanSalary + domain * standardDeviation;
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      const binCount = 100;
      const pointPitch = 9;
      let animationFrame = 0;

      function salaryX(salary) {
        return (
          xMin +
          ((salary - minimumSalary) / (maximumSalary - minimumSalary)) *
            (xMax - xMin)
        );
      }

      function binX(index) {
        return xMin + ((index + 0.5) / binCount) * (xMax - xMin);
      }

      function drawAxisTicks() {
        const ticks = document.getElementById("axis-ticks");

        for (
          let salary = minimumSalary;
          salary <= maximumSalary;
          salary += 10000
        ) {
          const x = salaryX(salary);
          const mark = document.createElementNS(svgNamespace, "line");
          mark.setAttribute("class", "tick-mark");
          mark.setAttribute("x1", x.toFixed(2));
          mark.setAttribute("x2", x.toFixed(2));
          mark.setAttribute("y1", String(baseline));
          mark.setAttribute("y2", String(baseline + 7));
          ticks.append(mark);

          const label = document.createElementNS(svgNamespace, "text");
          label.setAttribute("class", "tick-label");
          label.setAttribute("x", x.toFixed(2));
          label.setAttribute("y", String(baseline + 29));
          label.textContent = `$${salary / 1000}k`;
          ticks.append(label);
        }
      }

      const salaryFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0,
      });

      function createRandom(seed) {
        let state = seed >>> 0;

        return () => {
          state += 0x6d2b79f5;
          let value = state;
          value = Math.imul(value ^ (value >>> 15), value | 1);
          value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
      }

      function normalSample(random) {
        let u = 0;
        let v = 0;

        while (u === 0) u = random();
        while (v === 0) v = random();

        return Math.max(
          minimumSalary,
          Math.min(
            maximumSalary,
            meanSalary +
              standardDeviation *
                Math.max(
                  -domain,
                  Math.min(
                    domain,
                    Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v),
                  ),
                ),
          ),
        );
      }

      function easeOutCubic(progress) {
        return 1 - Math.pow(1 - progress, 3);
      }

      function showValue(circle, value) {
        const circleRect = circle.getBoundingClientRect();
        const wrapRect = chartWrap.getBoundingClientRect();
        tooltip.textContent = salaryFormatter.format(value);
        tooltip.style.left = `${circleRect.left + circleRect.width / 2 - wrapRect.left}px`;
        tooltip.style.top = `${circleRect.top - wrapRect.top}px`;
        tooltip.classList.add("visible");
      }

      function hideValue() {
        tooltip.classList.remove("visible");
      }

      function drawSmoothedLine(counts) {
        const sigma = 3;
        const smoothed = counts.map((_, index) => {
          let weightedCount = 0;
          let totalWeight = 0;

          for (
            let offset = -Math.ceil(sigma * 3);
            offset <= Math.ceil(sigma * 3);
            offset++
          ) {
            const sourceIndex = index + offset;
            if (sourceIndex < 0 || sourceIndex >= counts.length) continue;
            const weight = Math.exp(-0.5 * (offset / sigma) ** 2);
            weightedCount += counts[sourceIndex] * weight;
            totalWeight += weight;
          }

          return weightedCount / totalWeight;
        });
        const peak = Math.max(...smoothed);
        const tallestStack = Math.max(...counts);
        const points = smoothed
          .map((height, index) => ({
            x: binX(index),
            y:
              baseline -
              (height / peak) * tallestStack * pointPitch +
              pointPitch / 2,
          }))
          .filter((point, index) => smoothed[index] >= peak * 0.015);

        let path = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
        for (let index = 0; index < points.length - 1; index++) {
          const previous = points[Math.max(0, index - 1)];
          const current = points[index];
          const next = points[index + 1];
          const afterNext = points[Math.min(points.length - 1, index + 2)];
          const control1X = current.x + (next.x - previous.x) / 6;
          const control1Y = current.y + (next.y - previous.y) / 6;
          const control2X = next.x - (afterNext.x - current.x) / 6;
          const control2Y = next.y - (afterNext.y - current.y) / 6;
          path += ` C ${control1X.toFixed(2)} ${control1Y.toFixed(2)}, ${control2X.toFixed(2)} ${control2Y.toFixed(2)}, ${next.x.toFixed(2)} ${next.y.toFixed(2)}`;
        }

        smoothLine.setAttribute("d", path);
        smoothLine.classList.add("visible");
      }

      function generate() {
        cancelAnimationFrame(animationFrame);
        pointsLayer.replaceChildren();
        smoothLine.setAttribute("d", "");
        smoothLine.classList.remove("visible");
        hideValue();

        const count = Math.max(
          1,
          Math.min(1000, Math.floor(Number(countInput.value) || 1)),
        );
        countInput.value = count;
        const seed = Math.max(
          0,
          Math.min(2147483647, Math.floor(Number(seedInput.value) || 0)),
        );
        seedInput.value = seed;
        const random = createRandom(seed);
        const counts = Array(binCount).fill(0);
        const samples = Array.from({ length: count }, () => normalSample(random));
        const assignments = samples.map((sample) => {
          const index = Math.max(
            0,
            Math.min(
              binCount - 1,
              Math.floor(
                ((sample - minimumSalary) / (maximumSalary - minimumSalary)) *
                  binCount,
              ),
            ),
          );
          const stack = counts[index]++;
          return { sample, index, stack };
        });
        const tallestStack = Math.max(...counts);
        const topRoom = Math.max(16, baseline - tallestStack * pointPitch - 24);
        const duration = prefersReducedMotion.matches ? 0 : 760;
        const start = performance.now();

        const points = assignments.map(({ sample, index, stack }) => {
          const circle = document.createElementNS(svgNamespace, "circle");
          circle.setAttribute("class", "point");
          circle.setAttribute("r", "3.7");
          circle.setAttribute("cx", binX(index).toFixed(2));
          circle.setAttribute("cy", topRoom.toFixed(2));
          circle.setAttribute("tabindex", "0");
          circle.setAttribute("aria-label", salaryFormatter.format(sample));
          pointsLayer.append(circle);
          circle.addEventListener("pointerenter", () =>
            showValue(circle, sample),
          );
          circle.addEventListener("pointerleave", hideValue);
          circle.addEventListener("focus", () => showValue(circle, sample));
          circle.addEventListener("blur", hideValue);

          return {
            circle,
            targetY: baseline - (stack + 0.5) * pointPitch,
            delay: prefersReducedMotion.matches
              ? 0
              : stack * 65 + random() * 35,
          };
        });

        function animate(now) {
          let complete = true;

          for (const point of points) {
            const progress = Math.max(
              0,
              Math.min(1, (now - start - point.delay) / duration),
            );
            if (progress < 1) complete = false;
            const eased = easeOutCubic(progress);
            const y = topRoom + (point.targetY - topRoom) * eased;
            point.circle.setAttribute("cy", y.toFixed(2));
          }

          if (complete) {
            drawSmoothedLine(counts);
          } else {
            animationFrame = requestAnimationFrame(animate);
          }
        }

        if (prefersReducedMotion.matches) {
          for (const point of points)
            point.circle.setAttribute("cy", point.targetY.toFixed(2));
          drawSmoothedLine(counts);
        } else {
          animationFrame = requestAnimationFrame(animate);
        }
      }

      drawAxisTicks();
      document.getElementById("generate").addEventListener("click", generate);
      for (const input of [countInput, seedInput]) {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") generate();
        });
      }
    </script>
  </body>
</html>
