<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random forest playground</title>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body data-model="forest" data-sample-count="360">
    <main class="playground">
      <section class="controls" aria-label="Model controls">
        <label class="control" for="trees">
          <span class="control-label"
            >Number of trees <output id="trees-value">13</output></span
          >
          <input id="trees" type="range" min="3" max="25" step="2" value="13" />
        </label>
        <label class="control" for="forest-depth">
          <span class="control-label"
            >Tree depth <output id="forest-depth-value">4</output></span
          >
          <input
            id="forest-depth"
            type="range"
            min="1"
            max="7"
            step="1"
            value="4"
          />
        </label>
        <button class="fit-button" id="fit-button" type="button">
          Fit model <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </section>
      <div class="chart-heading">
        <div class="legend" aria-label="Chart legend">
          <span class="legend-item"><span class="swatch"></span>class 1</span>
          <span class="legend-item"
            ><span class="swatch warm"></span>class 2</span
          >
        </div>
      </div>
      <div class="plot-wrap">
        <canvas
          id="chart"
          role="img"
          aria-label="Classification examples and random forest decision regions; hover a square for class probabilities"
          aria-describedby="hint"
        ></canvas>
      </div>
      <div class="stats">
        <span class="stat" id="score-stat" hidden
          >Training match <output id="score-output">—</output></span
        >
      </div>
    </main>
    <script src="./playground.js"></script>
  </body>
</html>
