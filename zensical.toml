[project]
site_url = "https://www.example.com/"
site_name = "Documentation"
site_description = "Teaching materials of Joseph Barbier"
site_author = "Joseph Barbier"
copyright = "Copyright &copy; 2026 Joseph Barbier--Darnal"
nav = [
  "index.md",
  { "Kedge Data Analytics & AI" = [
    { "Syllabus" = "kedge_data_analytics_and_AI/syllabus.md" },
    { "Definitions of data and AI" = [
      { "Set up Positron and uv" = "kedge_data_analytics_and_AI/definition_of_data_and_ai/setup.md" },
      { "Definitions" = "kedge_data_analytics_and_AI/definition_of_data_and_ai/definitions.md" },
      { "Generative AI" = "kedge_data_analytics_and_AI/definition_of_data_and_ai/generative_ai.md" },
      { "Indigo" = "kedge_data_analytics_and_AI/definition_of_data_and_ai/indigo.md" },
    ] },
    { "Preparing data" = [
      { "Storing data" = "kedge_data_analytics_and_AI/preparing_data/storing_data.md" },
      { "Cleaning data" = "kedge_data_analytics_and_AI/preparing_data/cleaning.md" },
      { "Practical lab" = "kedge_data_analytics_and_AI/preparing_data/lab.md" },
    ] },
    { "Analyzing data" = [
      { "Other" = "kedge_data_analytics_and_AI/analyzing_data/other.md" },
    ] },
    { "Text mining" = [
      { "Other" = "kedge_data_analytics_and_AI/text_mining/other.md" },
    ] },
    { "Presenting data and ethical issues" = [
      { "Other" = "kedge_data_analytics_and_AI/presenting_data_and_ethical_issues/other.md" },
    ] },
    { "Group projects" = [
      { "Other" = "kedge_data_analytics_and_AI/group_projects/other.md" },
    ] },
  ] },
]

extra_css = [
  "https://unpkg.com/tabulator-tables@6.5.3/dist/css/tabulator.min.css",
  "stylesheets/style.css",
]
extra_javascript = [
  "https://unpkg.com/tabulator-tables@6.5.3/dist/js/tabulator.min.js",
  "javascripts/csv-table.js",
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "navigation.prune",
]

[project.theme.icon]
logo = "lucide/smile"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[project.plugins.markdown-exec]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
